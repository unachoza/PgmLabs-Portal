<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accelerator Command Center</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="bg-orb bg-orb-a"></div>
    <div class="bg-orb bg-orb-b"></div>

    <main class="shell">
      <header class="topbar">
        <h1>Accelerator Command Center</h1>
        <div class="topbar-actions">
          <span id="activeUser" class="pill hidden"></span>
          <button id="logoutBtn" class="btn ghost hidden">Log Out</button>
        </div>
      </header>

      <section id="loginSection" class="card auth-card">
        <h2>Sign In</h2>
        <p>Use seeded accounts to explore participant, admin, and funder experiences.</p>
        <form id="loginForm">
          <label>Email
            <input type="email" id="email" required value="admin@accelerator.org" />
          </label>
          <label>Password
            <input type="password" id="password" required value="password123" />
          </label>
          <button class="btn primary" type="submit">Sign In</button>
        </form>
        <p class="hint">
          Admin: admin@accelerator.org / password123
          <br />
          Funder: funder@bank.org / password123
          <br />
          Participant: participant1@example.org / password123
        </p>
        <p id="loginError" class="error hidden"></p>
      </section>

      <section id="appSection" class="hidden">
        <nav id="roleNav" class="role-nav"></nav>
        <div id="dashboard" class="dashboard-grid"></div>
      </section>
    </main>

    <script src="/js/app.js" type="module"></script>
  </body>
</html>
